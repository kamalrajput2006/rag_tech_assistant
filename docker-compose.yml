version: '3.8'

services:
  rag-app:
    build: .
    ports:
      - "8501:8501"
      - "8000:8000"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PORT=8501
      - API_URL=http://127.0.0.1:8000
    volumes:
      - chroma_data:/app/chroma_db
    restart: unless-stopped

volumes:
  chroma_data:
